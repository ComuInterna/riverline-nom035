<style>
  :root{
    --rojo:#e50d2e;
    --rojo-oscuro:#b80a24;
    --negro:#15161a;
    --gris-900:#1f2128;
    --gris-700:#4a4d57;
    --gris-500:#666973;
    --gris-200:#e7e8ec;
    --gris-100:#f4f4f7;
    --blanco:#ffffff;
    --verde-ok:#1e864a;
    --ambar:#83641e;
    --ambar-bg:#fbf3dd;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(21,22,26,.04), 0 8px 24px rgba(21,22,26,.06);
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{

    background:var(--gris-100);
    color:var(--negro);
    min-height:100vh;
    display:flex;
    flex-direction:column;

  .app{

    flex-direction:column;

    margin:0 auto;

  }

  .brand{

    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:15px;
    letter-spacing:.2px;
  }
  .brand-mark{
    width:10px;height:10px;border-radius:3px;background:var(--rojo);

    flex-shrink:0;
  }
  .brand small{
    display:block;
    font-weight:500;
    font-size:11px;
    color:var(--gris-500);
    letter-spacing:.3px;
  }
  .pill-confidencial{
    font-size:11.5px;
    font-weight:600;
    color:var(--verde-ok);
    background:#e8f6ee;
    padding:6px 11px;
    border-radius:100px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .pill-confidencial.no-anonima{
    color:var(--ambar);
    background:var(--ambar-bg);
  }
  .pill-confidencial svg{width:12px;height:12px;}

  .card{

    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:32px 28px;
  }

    .card{padding:24px 20px; border-radius:var(--radius-md);}

  .screen-login .card{ margin-top:8vh; }
  h1.titulo{
    font-size:24px;
    font-weight:800;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  p.subtitulo{
    color:var(--gris-700);
    font-size:14.5px;
    line-height:1.5;
    margin:0 0 24px;
  }
  label.campo-label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--gris-900);
    margin-bottom:7px;
  }
  input.campo-input{
    width:100%;
    padding:14px 16px;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--gris-200);
    font-family:var(--font);
    font-size:16px;
    background:var(--gris-100);
    transition:border-color .15s ease, background .15s ease;
  }
  input.campo-input:focus{
    outline:none;
    border-color:var(--rojo);
    background:var(--blanco);
  }
  .campo-grupo{margin-bottom:18px;}
  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:var(--font);
    font-weight:700;
    font-size:15px;
    border-radius:var(--radius-sm);
    padding:15px 22px;
    transition:transform .12s ease, opacity .12s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primario{
    background:var(--rojo);
    color:var(--blanco);
    width:100%;
  }
  .btn-primario:hover{ background:var(--rojo-oscuro); }
  .btn-primario:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-secundario{
    background:transparent;
    color:var(--gris-700);
    border:1.5px solid var(--gris-200);
  }
  .btn-secundario:hover{ background:var(--gris-100); }
  .error-msg{
    color:var(--rojo);
    font-size:13.5px;
    font-weight:600;
    margin-top:10px;
    display:none;
  }
  .error-msg.visible{display:block;}

  /* ---------- BIENVENIDA ---------- */
  .lista-check{ list-style:none; margin:0 0 26px; padding:0; display:flex; flex-direction:column; gap:14px;}
  .lista-check li{ display:flex; gap:12px; align-items:flex-start; font-size:14.5px; color:var(--gris-900); line-height:1.45;}
  .lista-check .icono{
    flex-shrink:0; width:26px;height:26px;border-radius:8px;
    background:var(--gris-100); display:flex;align-items:center;justify-content:center;
    color:var(--rojo);
  }
  .lista-check .icono.ambar{ color:var(--ambar); background:var(--ambar-bg); }
  .lista-check .icono svg{width:14px;height:14px;}

    background:var(--ambar-bg);

    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.5;
    color:var(--gris-900);
    margin:0 0 22px;
  }

  .opcion-guia{

    padding:16px 18px;
    border-radius:var(--radius-md);

    background:none;
    text-align:left;
    font-family:var(--font);

  .opcion-guia .flecha-guia{ color:var(--gris-500); flex-shrink:0; }

  .barra-progreso-fill{

  }
  .seccion-encabezado{
    font-size:12.5px;
    font-weight:700;
    color:var(--rojo);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:8px;

    border:none;
    margin:0;
    padding:0;

    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 16px;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--gris-200);
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
    font-size:15px;
    font-weight:600;
    color:var(--gris-900);
    position:relative;
  }

    position:absolute;
    opacity:0;
    width:1px;
    height:1px;
    margin:0;
    pointer-events:none;
  }
  .opcion:hover{ border-color:var(--gris-500); }
  .opcion.seleccionada{
    border-color:var(--rojo);
    background:#fdf1f2;
    color:var(--rojo-oscuro);
  }
  .opcion:focus-within{
    outline:2px solid var(--rojo);
    outline-offset:2px;
  }
  .opcion .radio-visual{
    width:19px;height:19px;border-radius:50%;
    border:2px solid var(--gris-200);
    flex-shrink:0;
    position:relative;
  }
  .opcion.seleccionada .radio-visual{ border-color:var(--rojo); }
  .opcion.seleccionada .radio-visual::after{
    content:'';
    position:absolute; inset:3px;
    border-radius:50%;
    background:var(--rojo);
  }
  .pregunta-si-no .opciones{ flex-direction:row; }
  .pregunta-si-no .opcion{ flex:1; justify-content:center; }

  .nav-encuesta{
    display:flex;
    gap:12px;
    margin-top:28px;
  }
  .nav-encuesta .btn-secundario{ flex:0 0 auto; padding:15px 18px; }
  .nav-encuesta .btn-primario{ flex:1; }

  .footer-guardado{
    text-align:center;
    font-size:12px;
    color:var(--gris-500);
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }

  /* ---------- GRACIAS ---------- */
  .screen-gracias .card{ text-align:center; margin-top:8vh; }
  .icono-check-grande{
    width:64px;height:64px;border-radius:50%;

    display:flex;align-items:center;justify-content:center;
    margin:0 auto 20px;
  }
  .icono-check-grande svg{ width:30px;height:30px; }

  .oculto{ display:none !important; }

  @media (prefers-color-scheme: dark){
    :root{
      --gris-100:#121317;
      --gris-200:#26282f;
      --blanco:#1b1c22;
      --negro:#f2f2f4;
      --gris-900:#eceeF1;
      --gris-700:#b7b9c2;
      --gris-500:#848790;
    }
    body{ background:#0c0d10; }
    .pill-confidencial{ background:#123420; }
    .pill-confidencial.no-anonima{ background:#3a2f14; }
    .opcion.seleccionada{ background:#301419; }
    .aviso-identificado{ background:#3a2f14; }
  }
</style>
</head>

// ---------------------------------------------------------------------
// Motor de "pasos" — genérico para las 3 guías.
// ---------------------------------------------------------------------
function construirPasos(definicion) {
  const pasos = definicion.secciones.map((s) => ({ tipo: 'seccion', ...s }));
  for (const bif of definicion.bifurcaciones) {
    pasos.push({ tipo: 'sino', clave: bif.clave, texto: bif.texto });
    pasos.push({ tipo: 'seccion', condicion: bif.clave, ...bif.seccion });
  }
  return pasos;
}

function pasoAplica(paso) {
  if (paso.condicion) return estado[paso.condicion] === true;
  if (paso.condicionRespuesta !== undefined) return estado.respuestas[paso.condicionRespuesta] === true;
  return true;
}

function totalReactivosAplicables() {
  let total = 0;
  for (const p of estado.pasos) {
    if (p.tipo === 'seccion' && pasoAplica(p)) total += p.items.length;
  }
  return total;
}
function reactivosRespondidos() {
  return Object.keys(estado.respuestas).length;
}

// ---------------------------------------------------------------------
// Persistencia local (buffer de autoguardado, por colaborador Y por guía)
// ---------------------------------------------------------------------
function claveBuffer(guia) {
  return `nom035_buffer_${estado.colaborador.codigo}_${guia}`;
}
function guardarBuffer() {
  const payload = {
    inicio: estado.inicio,
    atiendeClientes: estado.atiendeClientes,
    esJefe: estado.esJefe,
    respuestas: estado.respuestas,
    pasoActual: estado.pasoActual,
  };
  localStorage.setItem(claveBuffer(estado.guiaActual), JSON.stringify(payload));
}
function recuperarBuffer(codigo, guia) {
  const raw = localStorage.getItem(`nom035_buffer_${codigo}_${guia}`);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}
function borrarBuffer() {
  localStorage.removeItem(claveBuffer(estado.guiaActual));
}

async function buscarColaborador(codigo) {
  if (MODO_DEMO) {
    const encontrado = PADRON_DEMO.find((c) => c.codigo === codigo.trim());
    return encontrado || null;
  }
  const { data, error } = await supabaseClient
    .rpc('colaborador_buscar', { p_codigo: codigo.trim() })
    .maybeSingle();
  if (error) throw error;
  return data;
}

async function marcarAcceso(colaboradorId) {
  if (MODO_DEMO) return;
  await supabaseClient.rpc('marcar_acceso_colaborador', { p_colaborador_id: colaboradorId }).catch(() => {});
}

/** Regresa la lista de guías (['guia_3','guia_1', ...]) que le faltan a
 * este colaborador, en un orden fijo (III/II primero, I al final). */
function calcularGuiasPendientes(colaborador) {
  const pendientes = [];
  if (colaborador.status !== null && colaborador.status !== undefined && colaborador.status !== 'contesto') pendientes.push('guia_3');
  if (colaborador.status_guia2 !== null && colaborador.status_guia2 !== undefined && colaborador.status_guia2 !== 'contesto') pendientes.push('guia_2');
  if (colaborador.status_guia1 !== null && colaborador.status_guia1 !== undefined && colaborador.status_guia1 !== 'contesto') pendientes.push('guia_1');
  return pendientes;
}

function renderLogin() {
  main.innerHTML = `
    <div class="screen-login">
      <div class="card">
        <h1 class="titulo">Encuesta NOM-035</h1>
        <p class="subtitulo">Ingresa tu código de colaborador para comenzar.</p>
        <div class="campo-grupo">
          <label class="campo-label" for="input-codigo">Código de colaborador</label>
          <input id="input-codigo" class="campo-input" type="text" inputmode="numeric" placeholder="Ej. 1001" autocomplete="off" />
        </div>
        <button id="btn-entrar" class="btn btn-primario">Continuar</button>
        <p id="error-login" class="error-msg"></p>
      </div>
    </div>
  `;
  const input = document.getElementById('input-codigo');
  const boton = document.getElementById('btn-entrar');
  const error = document.getElementById('error-login');

  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') boton.click(); });

  boton.addEventListener('click', async () => {
    const codigo = input.value.trim();
    if (!codigo) return;
    boton.disabled = true;
    boton.textContent = 'Verificando…';
    error.classList.remove('visible');
    try {
      const colaborador = await buscarColaborador(codigo);
      if (!colaborador) {
        error.textContent = 'No encontramos ese código. Verifica con Desarrollo Humano.';
        error.classList.add('visible');
        boton.disabled = false;
        boton.textContent = 'Continuar';
        return;
      }
      estado.colaborador = Object.assign({ codigo: codigo.trim() }, colaborador);
      await marcarAcceso(colaborador.id);

      const pendientes = calcularGuiasPendientes(colaborador);
      if (pendientes.length === 0) {
        return renderNadaPendiente();
      }
      estado.pendientesRestantes = pendientes;

      // Si hay un buffer guardado de alguna guía pendiente, retomarla directo.
      const conBuffer = pendientes.find((g) => recuperarBuffer(estado.colaborador.codigo, g));
      if (conBuffer) {
        return iniciarGuia(conBuffer, true);
      }

      if (pendientes.length === 1) {
        return renderBienvenida(pendientes[0]);
      }
      return renderMenuGuias();
    } catch (e) {
      error.textContent = 'Ocurrió un problema al verificar tu código. Intenta de nuevo.';
      error.classList.add('visible');
      boton.disabled = false;
      boton.textContent = 'Continuar';
    }
  });
}

// ---------------------------------------------------------------------
// Arranque de una guía (nueva o retomada desde buffer)
// ---------------------------------------------------------------------
function iniciarGuia(guia, retomarBuffer) {
  estado.guiaActual = guia;
  estado.pasos = construirPasos(DEFINICIONES[guia]);
  actualizarPillConfidencial(DEFINICIONES[guia].anonima);

  if (retomarBuffer) {
    const buffer = recuperarBuffer(estado.colaborador.codigo, guia);
    estado.inicio = buffer.inicio;
    estado.atiendeClientes = buffer.atiendeClientes;
    estado.esJefe = buffer.esJefe;
    estado.respuestas = buffer.respuestas;
    estado.pasoActual = buffer.pasoActual;
  } else {
    estado.inicio = Date.now();
    estado.atiendeClientes = null;
    estado.esJefe = null;
    estado.respuestas = {};
    estado.pasoActual = 0;
    guardarBuffer();
  }
  renderEncuesta();
}

// ---------------------------------------------------------------------
// Encuesta (genérica para las 3 guías)
// ---------------------------------------------------------------------
function pasoVisibleSiguiente(desde, direccion) {
  let i = desde;
  while (i >= 0 && i < estado.pasos.length) {
    if (pasoAplica(estado.pasos[i])) return i;
    i += direccion;
  }
  return direccion > 0 ? estado.pasos.length : -1;
}

function renderEncuesta() {
  estado.pasoActual = pasoVisibleSiguiente(estado.pasoActual, 1);
  if (estado.pasoActual >= estado.pasos.length) { return renderRevision(); }

  const paso = estado.pasos[estado.pasoActual];
  if (paso.tipo === 'sino') return renderPasoSiNo(paso);
  return renderPasoSeccion(paso);
}

function renderBarra() {
  const respondidos = reactivosRespondidos();
  const total = totalReactivosAplicables();
  const porcentaje = total > 0 ? Math.round((respondidos / total) * 100) : 0;
  return `
    <div class="barra-progreso-wrap">
      <div class="barra-progreso-fila">
        <span>${porcentaje}% completado</span>
        <span id="cronometro">00:00</span>
      </div>
      <div class="barra-progreso-track"><div class="barra-progreso-fill" style="width:${porcentaje}%"></div></div>
    </div>
  `;
}

function iniciarCronometro() {
  const el = document.getElementById('cronometro');
  if (!el) return;
  clearInterval(window.__cronoInterval);
  window.__cronoInterval = setInterval(() => {
    const seg = Math.floor((Date.now() - estado.inicio) / 1000);
    const mm = String(Math.floor(seg / 60)).padStart(2, '0');
    const ss = String(seg % 60).padStart(2, '0');
    const target = document.getElementById('cronometro');
    if (target) target.textContent = `${mm}:${ss}`;
  }, 1000);
}

function renderPasoSiNo(paso) {
  const valorActual = estado[paso.clave];
  main.innerHTML = `
    ${renderBarra()}
    <div class="card pregunta-si-no">
      <fieldset class="opciones">
        <legend class="reactivo-texto" style="font-size:19px;">${paso.texto}</legend>
        <label class="opcion ${valorActual === true ? 'seleccionada' : ''}">
          <input type="radio" name="pregunta-sino" value="si" ${valorActual === true ? 'checked' : ''} />
          <span class="radio-visual" aria-hidden="true"></span> Sí
        </label>
        <label class="opcion ${valorActual === false ? 'seleccionada' : ''}">
          <input type="radio" name="pregunta-sino" value="no" ${valorActual === false ? 'checked' : ''} />
          <span class="radio-visual" aria-hidden="true"></span> No
        </label>
      </fieldset>
      <div class="nav-encuesta">
        <button class="btn btn-secundario" id="btn-atras">Atrás</button>
        <button class="btn btn-primario" id="btn-siguiente" ${valorActual === null ? 'disabled' : ''}>Siguiente</button>
      </div>
    </div>
    <p class="footer-guardado">${iconoNube()} Guardado automáticamente</p>
  `;
  iniciarCronometro();

  document.querySelectorAll('input[name="pregunta-sino"]').forEach((input) => {
    input.addEventListener('change', () => {
      estado[paso.clave] = input.value === 'si';
      guardarBuffer();
      renderPasoSiNo(paso);
    });
  });
  document.getElementById('btn-siguiente').addEventListener('click', () => {
    estado.pasoActual = pasoVisibleSiguiente(estado.pasoActual + 1, 1);
    guardarBuffer();
    renderEncuesta();
  });
  document.getElementById('btn-atras').addEventListener('click', () => {
    estado.pasoActual = pasoVisibleSiguiente(estado.pasoActual - 1, -1);
    if (estado.pasoActual < 0) { estado.pasoActual = 0; return renderBienvenida(estado.guiaActual); }
    renderEncuesta();
  });
}

// Cada sección se responde reactivo por reactivo dentro del mismo paso.
// tipoEscala determina si se muestran 5 opciones (Likert) o 2 (Sí/No).
function renderPasoSeccion(paso, indiceItemLocal = 0) {
  const def = definicionActual();
  const numero = paso.items[indiceItemLocal];
  const respuestaActual = estado.respuestas[numero];
  const esLikert = def.tipoEscala === 'likert5';

  const opciones = esLikert
    ? ESCALA.map((etiqueta, idx) => ({ etiqueta, valor: String(idx), seleccionada: respuestaActual === idx }))
    : [
        { etiqueta: 'Sí', valor: 'si', seleccionada: respuestaActual === true },
        { etiqueta: 'No', valor: 'no', seleccionada: respuestaActual === false },
      ];

  main.innerHTML = `
    ${renderBarra()}
    <div class="card ${esLikert ? '' : 'pregunta-si-no'}">
      <p class="seccion-encabezado">${paso.encabezado}</p>
      <fieldset class="opciones">
        <legend class="reactivo-texto">${def.textos[numero]}</legend>
        ${opciones.map((op) => `
          <label class="opcion ${op.seleccionada ? 'seleccionada' : ''}">
            <input type="radio" name="reactivo-${numero}" value="${op.valor}" ${op.seleccionada ? 'checked' : ''} />
            <span class="radio-visual" aria-hidden="true"></span> ${op.etiqueta}
          </label>
        `).join('')}
      </fieldset>
      <div class="nav-encuesta">
        <button class="btn btn-secundario" id="btn-atras">Atrás</button>
        <button class="btn btn-primario" id="btn-siguiente" ${respuestaActual === undefined ? 'disabled' : ''}>Siguiente</button>
      </div>
    </div>
    <p class="footer-guardado">${iconoNube()} Guardado automáticamente</p>
  `;
  iniciarCronometro();

  document.querySelectorAll(`input[name="reactivo-${numero}"]`).forEach((input) => {
    input.addEventListener('change', () => {
      estado.respuestas[numero] = esLikert ? Number(input.value) : (input.value === 'si');
      guardarBuffer();
      renderPasoSeccion(paso, indiceItemLocal);
    });
  });

  document.getElementById('btn-siguiente').addEventListener('click', () => {
    if (indiceItemLocal + 1 < paso.items.length) {
      renderPasoSeccion(paso, indiceItemLocal + 1);
    } else {
      estado.pasoActual = pasoVisibleSiguiente(estado.pasoActual + 1, 1);
      guardarBuffer();
      renderEncuesta();
    }
  });

  document.getElementById('btn-atras').addEventListener('click', () => {
    if (indiceItemLocal > 0) {
      renderPasoSeccion(paso, indiceItemLocal - 1);
    } else {
      const anterior = pasoVisibleSiguiente(estado.pasoActual - 1, -1);
      if (anterior < 0) { return renderBienvenida(estado.guiaActual); }
      estado.pasoActual = anterior;
      const pasoAnterior = estado.pasos[anterior];
      if (pasoAnterior.tipo === 'seccion') {
        renderPasoSeccion(pasoAnterior, pasoAnterior.items.length - 1);
      } else {
        renderEncuesta();
      }
    }
  });
}

function iconoNube(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18a4 4 0 010-8 5 5 0 019.6-1.5A4.5 4.5 0 0118 18H6z"/></svg>`; }

// ---------------------------------------------------------------------
// Revisión final y cierre
// ---------------------------------------------------------------------
function renderRevision() {
  const def = definicionActual();
  const total = totalReactivosAplicables();
  const respondidos = reactivosRespondidos();
  const completo = respondidos === total;

  const mensajeCompleto = def.anonima
    ? 'Contestaste todos los reactivos. Una vez que envíes, no podrás modificar tus respuestas y no verás tu resultado individual — solo tu equipo de Desarrollo Humano verá los resultados agregados y anónimos.'
    : 'Contestaste todo. Una vez que envíes, no podrás modificar tus respuestas. Recuerda que este cuestionario, a diferencia de los demás, sí queda registrado con tu nombre.';

  main.innerHTML = `
    <div class="card">
      <h1 class="titulo">Revisa antes de enviar</h1>
      <p class="subtitulo">${completo ? mensajeCompleto : `Te faltan ${total - respondidos} reactivos por contestar.`}</p>
      <div class="nav-encuesta">
        <button class="btn btn-secundario" id="btn-revisar-atras">Regresar a la encuesta</button>
        <button class="btn btn-primario" id="btn-enviar" ${completo ? '' : 'disabled'}>Enviar respuestas</button>
      </div>
    </div>
  `;
  document.getElementById('btn-revisar-atras').addEventListener('click', () => {
    estado.pasoActual = 0;
    renderEncuesta();
  });
  document.getElementById('btn-enviar').addEventListener('click', enviarEncuesta);
}

function construirCuerpoEnvio() {
  const def = definicionActual();
  if (def.tipoEscala === 'sino') {
    const respuestas = {};
    for (const [numero, valor] of Object.entries(estado.respuestas)) {
      respuestas[def.prefijoReactivo + numero] = valor;
    }
    return { colaborador_id: estado.colaborador.id, respuestas };
  }
  const duracionSegundos = Math.floor((Date.now() - estado.inicio) / 1000);
  const respuestasPlano = Object.entries(estado.respuestas).map(([numero, indice]) => ({
    reactivo_id: def.prefijoReactivo + numero,
    indice,
  }));
  return {
    colaborador_id: estado.colaborador.id,
    respuestas: respuestasPlano,
    atiendeClientes: estado.atiendeClientes,
    esJefe: estado.esJefe,
    duracion_segundos: duracionSegundos,
  };
}

async function enviarEncuesta() {
  const def = definicionActual();
  const boton = document.getElementById('btn-enviar');
  boton.disabled = true;
  boton.textContent = 'Enviando…';

  try {
    if (MODO_DEMO) {
      await new Promise((r) => setTimeout(r, 700));
    } else {
      const { error } = await supabaseClient.functions.invoke(def.edgeFunction, { body: construirCuerpoEnvio() });
      if (error) throw error;
    }
    borrarBuffer();
    estado.pendientesRestantes = estado.pendientesRestantes.filter((g) => g !== estado.guiaActual);
    renderGracias();
  } catch (e) {
    boton.disabled = false;
    boton.textContent = 'Enviar respuestas';
    alert('No se pudo enviar tu encuesta. Por favor intenta de nuevo. Tu avance sigue guardado.');
  }
}

function renderGracias() {
  const quedan = estado.pendientesRestantes.length;
  actualizarPillConfidencial(true);
  main.innerHTML = `
    <div class="screen-gracias">
      <div class="card">
        <div class="icono-check-grande">${iconoCheck()}</div>
        <h1 class="titulo">${quedan > 0 ? '¡Gracias! Esa ya quedó.' : 'Gracias por participar'}</h1>
        <p class="subtitulo">${quedan > 0
          ? `Aún te ${quedan === 1 ? 'falta 1 encuesta' : `faltan ${quedan} encuestas`} por contestar.`
          : 'Tus respuestas fueron registradas. Ayudarán a mejorar nuestro entorno de trabajo en Riverline.'}</p>
        ${quedan > 0 ? '<button id="btn-continuar" class="btn btn-primario">Continuar</button>' : ''}
      </div>
    </div>
  `;
  if (quedan > 0) {
    document.getElementById('btn-continuar').addEventListener('click', () => {
      if (estado.pendientesRestantes.length === 1) {
        renderBienvenida(estado.pendientesRestantes[0]);
      } else {
        renderMenuGuias();
      }
    });
  }
}
