const SECCION_CLIENTES = { encabezado: 'Las preguntas siguientes están relacionadas con la atención a clientes y usuarios.', items:[65,66,67,68] };
const SECCION_JEFE = { encabezado: 'Las siguientes preguntas están relacionadas con las actitudes de las personas que supervisa.', items:[69,70,71,72] };

const ESCALA = ['Siempre', 'Casi siempre', 'Algunas veces', 'Casi nunca', 'Nunca'];

// ---------------------------------------------------------------------
// Estado de la aplicación
// ---------------------------------------------------------------------
const estado = {
  pantalla: 'login',
  colaborador: null,       // { id, codigo, nombre }
  inicio: null,            // timestamp de inicio de la encuesta
  atiendeClientes: null,   // true/false/null
  esJefe: null,            // true/false/null
  respuestas: {},          // { [numeroReactivo]: indice(0-4) }
  pasoActual: 0,           // índice dentro de la lista lineal de "pasos"
};

const main = document.getElementById('main');

// ---------------------------------------------------------------------
// Construcción de la lista lineal de pasos de la encuesta:
// cada "paso" es una sección de reactivos, o una pregunta Sí/No de bifurcación.
// ---------------------------------------------------------------------
function construirPasos() {
  const pasos = [...SECCIONES.map((s) => ({ tipo: 'seccion', ...s }))];
  pasos.push({ tipo: 'sino', clave: 'atiendeClientes', texto: 'En mi trabajo debo brindar servicio a clientes o usuarios:' });
  pasos.push({ tipo: 'seccion', condicion: 'atiendeClientes', ...SECCION_CLIENTES });
  pasos.push({ tipo: 'sino', clave: 'esJefe', texto: 'Soy jefe de otros trabajadores:' });
  pasos.push({ tipo: 'seccion', condicion: 'esJefe', ...SECCION_JEFE });
  return pasos;
}
const PASOS = construirPasos();

function pasoAplica(paso) {
  if (!paso.condicion) return true;
  return estado[paso.condicion] === true;
}

function totalReactivosAplicables() {
  let total = 0;
  for (const p of PASOS) {
    if (p.tipo === 'seccion' && pasoAplica(p)) total += p.items.length;
  }
  return total;
}
function reactivosRespondidos() {
  return Object.keys(estado.respuestas).length;
}

// ---------------------------------------------------------------------
// Persistencia local (buffer de autoguardado, por colaborador)
// ---------------------------------------------------------------------
function claveBuffer() {
  return `nom035_buffer_${estado.colaborador.codigo}`;
}
function guardarBuffer() {
  const payload = {
    inicio: estado.inicio,
    atiendeClientes: estado.atiendeClientes,
    esJefe: estado.esJefe,
    respuestas: estado.respuestas,
    pasoActual: estado.pasoActual,
  };
  localStorage.setItem(claveBuffer(), JSON.stringify(payload));

  // En producción: además de guardar localmente, se puede sincronizar
  // el avance contra una tabla temporal en Supabase (seguimiento.buffer_respuestas)
  // para permitir reanudar desde otro dispositivo. Ver nota de arquitectura:
  // ese buffer se elimina por completo al finalizar (Edge Function finalize-survey).
  if (supabase) {
    supabase.from('seguimiento_buffer_respuestas')
      .upsert({ colaborador_id: estado.colaborador.id, payload, actualizado_en: new Date().toISOString() })
      .then(() => {})
      .catch(() => { /* fallo silencioso: el buffer local ya lo protege */ });
  }
}
function recuperarBuffer(codigo) {
  const raw = localStorage.getItem(`nom035_buffer_${codigo}`);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}
function borrarBuffer() {
  localStorage.removeItem(claveBuffer());
}

// ---------------------------------------------------------------------
// Login
// ---------------------------------------------------------------------
async function buscarColaborador(codigo) {
  if (MODO_DEMO) {
    const encontrado = PADRON_DEMO.find((c) => c.codigo === codigo.trim());
    return encontrado || null;
  }
  // Nota: en producción, este RPC (ver Módulo 9) es la ÚNICA forma en que el
  // navegador del colaborador puede tocar seguimiento.colaboradores. Regresa
  // solo id/nombre/status — nunca email, puesto o departamento.
  const { data, error } = await supabase
    .rpc('colaborador_buscar', { p_codigo: codigo.trim() })
    .maybeSingle();
  if (error) throw error;
  return data;
}

async function marcarAcceso(colaboradorId) {
  if (MODO_DEMO) return;
  await supabase.rpc('marcar_acceso_colaborador', { p_colaborador_id: colaboradorId })
    .catch(() => {});
}

function renderLogin() {
  main.innerHTML = `
    <div class="screen-login">
      <div class="card">
        <h1 class="titulo">Encuesta NOM-035</h1>
        <p class="subtitulo">Ingresa tu código de colaborador para comenzar. Este código solo se usa para registrar que ya respondiste — tus respuestas nunca se vinculan a tu identidad.</p>
        <div class="campo-grupo">
          <label class="campo-label" for="input-codigo">Código de colaborador</label>
          <input id="input-codigo" class="campo-input" type="text" inputmode="numeric" placeholder="Ej. 1001" autocomplete="off" />
        </div>
        <button id="btn-entrar" class="btn btn-primario">Continuar</button>
        <p id="error-login" class="error-msg"></p>
      </div>
    </div>
  `;
  const input = document.getElementById('input-codigo');
  const boton = document.getElementById('btn-entrar');
  const error = document.getElementById('error-login');

  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') boton.click(); });

  boton.addEventListener('click', async () => {
    const codigo = input.value.trim();
    if (!codigo) return;
    boton.disabled = true;
    boton.textContent = 'Verificando…';
    error.classList.remove('visible');
    try {
      const colaborador = await buscarColaborador(codigo);
      if (!colaborador) {
        error.textContent = 'No encontramos ese código. Verifica con Desarrollo Humano.';
        error.classList.add('visible');
        boton.disabled = false;
        boton.textContent = 'Continuar';
        return;
      }
      if (colaborador.status === 'contesto') {
        error.textContent = 'Este código ya registró una encuesta contestada.';
        error.classList.add('visible');
        boton.disabled = false;
        boton.textContent = 'Continuar';
        return;
      }
      estado.colaborador = Object.assign({ codigo: codigo.trim() }, colaborador);
      await marcarAcceso(colaborador.id);

      const buffer = recuperarBuffer(estado.colaborador.codigo);
      if (buffer) {
        estado.inicio = buffer.inicio;
        estado.atiendeClientes = buffer.atiendeClientes;
        estado.esJefe = buffer.esJefe;
        estado.respuestas = buffer.respuestas;
        estado.pasoActual = buffer.pasoActual;
        estado.pantalla = 'encuesta';
        renderEncuesta();
      } else {
        estado.pantalla = 'bienvenida';
        renderBienvenida();
      }
    } catch (e) {
      error.textContent = 'Ocurrió un problema al verificar tu código. Intenta de nuevo.';
      error.classList.add('visible');
      boton.disabled = false;
      boton.textContent = 'Continuar';
    }
  });
}

// ---------------------------------------------------------------------
// Bienvenida
// ---------------------------------------------------------------------
function renderBienvenida() {
  main.innerHTML = `
    <div class="screen-bienvenida">
      <div class="card">
        <h1 class="titulo">Antes de comenzar</h1>
        <p class="subtitulo">Esta encuesta identifica los factores de riesgo psicosocial en el trabajo y evalúa el entorno organizacional, conforme a la NOM-035-STPS-2018.</p>
        <ul class="lista-check">
          <li><span class="icono">${iconoCheck()}</span> Tus respuestas son completamente anónimas. Nunca se guarda tu nombre junto con lo que respondas.</li>
          <li><span class="icono">${iconoCheck()}</span> Solo se registra que ya contestaste — jamás qué contestaste.</li>
          <li><span class="icono">${iconoReloj()}</span> Toma entre 10 y 15 minutos. Puedes cerrar el navegador y continuar después donde te quedaste.</li>
          <li><span class="icono">${iconoCheck()}</span> No hay respuestas correctas o incorrectas. Responde con sinceridad, pensando en los últimos dos meses.</li>
        </ul>
        <button id="btn-comenzar" class="btn btn-primario">Comenzar encuesta</button>
      </div>
    </div>
  `;
  document.getElementById('btn-comenzar').addEventListener('click', () => {
    estado.inicio = Date.now();
    estado.pasoActual = 0;
    estado.pantalla = 'encuesta';
    guardarBuffer();
    renderEncuesta();
  });
}

function iconoCheck(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>`; }
function iconoReloj(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`; }

// ---------------------------------------------------------------------
// Encuesta
// ---------------------------------------------------------------------
function pasoVisibleSiguiente(desde, direccion) {
  let i = desde;
  while (i >= 0 && i < PASOS.length) {
    if (pasoAplica(PASOS[i])) return i;
    i += direccion;
  }
  return direccion > 0 ? PASOS.length : -1;
}

function renderEncuesta() {
  // Asegura que el paso actual sea uno visible (por si venimos de un buffer
  // guardado antes de contestar la bifurcación).
  estado.pasoActual = pasoVisibleSiguiente(estado.pasoActual, 1);
  if (estado.pasoActual >= PASOS.length) { return renderRevision(); }

  const paso = PASOS[estado.pasoActual];
  const respondidos = reactivosRespondidos();
  const total = totalReactivosAplicables();
  const porcentaje = total > 0 ? Math.round((respondidos / total) * 100) : 0;

  if (paso.tipo === 'sino') return renderPasoSiNo(paso, porcentaje);
  return renderPasoSeccion(paso, porcentaje);
}

function renderBarra(porcentaje) {
  return `
    <div class="barra-progreso-wrap">
      <div class="barra-progreso-fila">
        <span>${porcentaje}% completado</span>
        <span id="cronometro">00:00</span>
      </div>
      <div class="barra-progreso-track"><div class="barra-progreso-fill" style="width:${porcentaje}%"></div></div>
    </div>
  `;
}

function iniciarCronometro() {
  const el = document.getElementById('cronometro');
  if (!el) return;
  clearInterval(window.__cronoInterval);
  window.__cronoInterval = setInterval(() => {
    const seg = Math.floor((Date.now() - estado.inicio) / 1000);
    const mm = String(Math.floor(seg / 60)).padStart(2, '0');
    const ss = String(seg % 60).padStart(2, '0');
    const target = document.getElementById('cronometro');
    if (target) target.textContent = `${mm}:${ss}`;
  }, 1000);
}

function renderPasoSiNo(paso, porcentaje) {
  const valorActual = estado[paso.clave];
  main.innerHTML = `
    ${renderBarra(porcentaje)}
    <div class="card pregunta-si-no">
      <fieldset class="opciones">
        <legend class="reactivo-texto" style="font-size:19px;">${paso.texto}</legend>
        <label class="opcion ${valorActual === true ? 'seleccionada' : ''}">
          <input type="radio" name="pregunta-sino" value="si" ${valorActual === true ? 'checked' : ''} />
          <span class="radio-visual" aria-hidden="true"></span> Sí
        </label>
        <label class="opcion ${valorActual === false ? 'seleccionada' : ''}">
          <input type="radio" name="pregunta-sino" value="no" ${valorActual === false ? 'checked' : ''} />
          <span class="radio-visual" aria-hidden="true"></span> No
        </label>
      </fieldset>
      <div class="nav-encuesta">
        <button class="btn btn-secundario" id="btn-atras">Atrás</button>
        <button class="btn btn-primario" id="btn-siguiente" ${valorActual === null ? 'disabled' : ''}>Siguiente</button>
      </div>
    </div>
    <p class="footer-guardado">${iconoNube()} Guardado automáticamente</p>
  `;
  iniciarCronometro();

  document.querySelectorAll('input[name="pregunta-sino"]').forEach((input) => {
    input.addEventListener('change', () => {
      estado[paso.clave] = input.value === 'si';
      guardarBuffer();
      renderPasoSiNo(paso, porcentaje);
    });
  });
  document.getElementById('btn-siguiente').addEventListener('click', () => {
    estado.pasoActual = pasoVisibleSiguiente(estado.pasoActual + 1, 1);
    guardarBuffer();
    renderEncuesta();
  });
  document.getElementById('btn-atras').addEventListener('click', () => {
    estado.pasoActual = pasoVisibleSiguiente(estado.pasoActual - 1, -1);
    if (estado.pasoActual < 0) { estado.pasoActual = 0; return renderBienvenida(); }
    renderEncuesta();
  });
}

// Cada sección se responde reactivo por reactivo dentro del mismo paso,
// para mantener la barra de progreso y el encabezado de sección visibles.
function renderPasoSeccion(paso, porcentaje, indiceItemLocal = 0) {
  const numero = paso.items[indiceItemLocal];
  const respuestaActual = estado.respuestas[numero];

  main.innerHTML = `
    ${renderBarra(Math.round((reactivosRespondidos() / totalReactivosAplicables()) * 100))}
    <div class="card">
      <p class="seccion-encabezado">${paso.encabezado}</p>
      <fieldset class="opciones">
        <legend class="reactivo-texto">${TEXTOS[numero]}</legend>
        ${ESCALA.map((texto, idx) => `
          <label class="opcion ${respuestaActual === idx ? 'seleccionada' : ''}">
            <input type="radio" name="reactivo-${numero}" value="${idx}" ${respuestaActual === idx ? 'checked' : ''} />
            <span class="radio-visual" aria-hidden="true"></span> ${texto}
          </label>
        `).join('')}
      </fieldset>
      <div class="nav-encuesta">
        <button class="btn btn-secundario" id="btn-atras">Atrás</button>
        <button class="btn btn-primario" id="btn-siguiente" ${respuestaActual === undefined ? 'disabled' : ''}>Siguiente</button>
      </div>
    </div>
    <p class="footer-guardado">${iconoNube()} Guardado automáticamente</p>
  `;
  iniciarCronometro();

  document.querySelectorAll(`input[name="reactivo-${numero}"]`).forEach((input) => {
    input.addEventListener('change', () => {
      estado.respuestas[numero] = Number(input.value);
      guardarBuffer();
      renderPasoSeccion(paso, porcentaje, indiceItemLocal);
    });
  });

  document.getElementById('btn-siguiente').addEventListener('click', () => {
    if (indiceItemLocal + 1 < paso.items.length) {
      renderPasoSeccion(paso, porcentaje, indiceItemLocal + 1);
    } else {
      estado.pasoActual = pasoVisibleSiguiente(estado.pasoActual + 1, 1);
      guardarBuffer();
      renderEncuesta();
    }
  });

  document.getElementById('btn-atras').addEventListener('click', () => {
    if (indiceItemLocal > 0) {
      renderPasoSeccion(paso, porcentaje, indiceItemLocal - 1);
    } else {
      const anterior = pasoVisibleSiguiente(estado.pasoActual - 1, -1);
      if (anterior < 0) { return renderBienvenida(); }
      estado.pasoActual = anterior;
      const pasoAnterior = PASOS[anterior];
      if (pasoAnterior.tipo === 'seccion') {
        renderPasoSeccion(pasoAnterior, porcentaje, pasoAnterior.items.length - 1);
      } else {
        renderEncuesta();
      }
    }
  });
}

function iconoNube(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18a4 4 0 010-8 5 5 0 019.6-1.5A4.5 4.5 0 0118 18H6z"/></svg>`; }

// ---------------------------------------------------------------------
// Revisión final y cierre
// ---------------------------------------------------------------------
function renderRevision() {
  const total = totalReactivosAplicables();
  const respondidos = reactivosRespondidos();
  const completo = respondidos === total;

  main.innerHTML = `
    <div class="card">
      <h1 class="titulo">Revisa antes de enviar</h1>
      <p class="subtitulo">${completo
        ? 'Contestaste todos los reactivos. Una vez que envíes, no podrás modificar tus respuestas y no verás tu resultado individual — solo tu equipo de Desarrollo Humano verá los resultados agregados y anónimos.'
        : `Te faltan ${total - respondidos} reactivos por contestar.`}</p>
      <div class="nav-encuesta">
        <button class="btn btn-secundario" id="btn-revisar-atras">Regresar a la encuesta</button>
        <button class="btn btn-primario" id="btn-enviar" ${completo ? '' : 'disabled'}>Enviar respuestas</button>
      </div>
    </div>
  `;
  document.getElementById('btn-revisar-atras').addEventListener('click', () => {
    estado.pasoActual = 0;
    renderEncuesta();
  });
  document.getElementById('btn-enviar').addEventListener('click', enviarEncuesta);
}

async function enviarEncuesta() {
  const boton = document.getElementById('btn-enviar');
  boton.disabled = true;
  boton.textContent = 'Enviando…';

  const duracionSegundos = Math.floor((Date.now() - estado.inicio) / 1000);
  const respuestasPlano = Object.entries(estado.respuestas).map(([numero, indice]) => ({
    reactivo_id: `R${numero}`,
    indice,
  }));

  try {
    if (MODO_DEMO) {
      // En modo demo no hay motor de calificación server-side conectado;
      // solo simulamos el cierre para poder probar el flujo completo.
      await new Promise((r) => setTimeout(r, 700));
    } else {
      const { error } = await supabase.functions.invoke('finalize-survey', {
        body: {
          colaborador_id: estado.colaborador.id,
          respuestas: respuestasPlano,
          atiendeClientes: estado.atiendeClientes,
          esJefe: estado.esJefe,
          duracion_segundos: duracionSegundos,
        },
      });
      if (error) throw error;
    }
    borrarBuffer();
    renderGracias();
  } catch (e) {
    boton.disabled = false;
    boton.textContent = 'Enviar respuestas';
    alert('No se pudo enviar tu encuesta. Por favor intenta de nuevo. Tu avance sigue guardado.');
  }
}

function renderGracias() {
  main.innerHTML = `
    <div class="screen-gracias">
      <div class="card">
        <div class="icono-check-grande">${iconoCheck()}</div>
        <h1 class="titulo">Gracias por participar</h1>
        <p class="subtitulo">Tu encuesta fue registrada de forma anónima. Los resultados agregados ayudarán a mejorar nuestro entorno de trabajo en Riverline.</p>
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Arranque
// ---------------------------------------------------------------------
renderLogin();
</script>

</html>
